# Lambs Nginx 配置片段 — Go 版本
# 添加到 /etc/nginx/sites-available/wool-cc-cd 的 443 SSL server 块中
# Gateway host (serves the SPA) (YOUR_WEB_IP)

# Lambs Web UI
location = /lambs { return 301 /lambs/; }
location /lambs/ {
    root /var/www;
    try_files $uri $uri/ /lambs/index.html;
}

# Lambs API (反向代理到 App1)
location /lambs/api/ {
    limit_req zone=lambs_api burst=20 nodelay;
    client_max_body_size 5M;
    proxy_pass http://YOUR_APP_IP:3602/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 受管项目网关 (由 Lambs 自动生成)
include /etc/nginx/sites-available/lambs-managed.conf;
