name: Go Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the runner's preinstalled toolchain — a mismatch makes
          # -coverprofile recompile stdlib and fail with
          # "compile: version does not match go tool version".
          go-version: '1.25.7'
      # -race catches data races (procmgr/tcpproxy had three fixed in round 1);
      # ubuntu runners ship gcc so CGO race builds work.
      - name: Test with race detector
        run: go test -race ./...
      - name: Coverage report
        run: |
          go test -coverprofile=coverage.out ./...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "Total coverage: ${TOTAL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${TOTAL}"
