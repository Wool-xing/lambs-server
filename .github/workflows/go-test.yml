name: Go Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: lambs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lambs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real-DB integration tests (notifications authz matrix, gate checks,
      # main-package E2E smoke) run against this container.
      LAMBS_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/lambs_test?sslmode=disable
      LAMBS_TEST_MYSQL_DSN: mysql://root:rootpw@127.0.0.1:3306/lambs_test
      LAMBS_TEST_REDIS_ADDR: 127.0.0.1:6379
      LAMBS_TEST_MONGO_ADDR: 127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the runner's preinstalled toolchain — a mismatch makes
          # -coverprofile recompile stdlib and fail with
          # "compile: version does not match go tool version".
          go-version: '1.25.7'
      # -race catches data races (procmgr/tcpproxy had three fixed in round 1);
      # ubuntu runners ship gcc so CGO race builds work.
      # -p 1 serializes packages: they share one test DB and main's E2E
      # drops/recreates the fixture tables.
      - name: Install pg_dump (PG backup test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test with race detector
        run: go test -p 1 -race ./...
      - name: Privacy scan
        run: bash scripts/privacy-scan.sh .
      - name: Route x method x status matrix
        run: bash scripts/route-coverage.sh
      - name: Staticcheck (dead code)
        run: |
          # Pinned: @latest pulls new rule sets that can redden old code
          # overnight (round-8 calibration). Bump deliberately.
          go install honnef.co/go/tools/cmd/staticcheck@2026.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Race x2 (runtime hot paths)
        run: go test -p 1 -race -count=2 ./internal/runtime/ ./internal/notify/
      - name: Coverage report + regression gate
        run: |
          go test -p 1 -coverprofile=coverage.out ./...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          # Gate at the current level: new code must not drag coverage down
          # (raise the bar as the sprint lands; round-7 calibration item).
          THRESHOLD=56.0
          echo "Total coverage: ${TOTAL}% (threshold ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${TOTAL}% (threshold ${THRESHOLD}%)"
          if awk "BEGIN{exit !(${TOTAL} < ${THRESHOLD})}"; then
            echo "coverage regressed below ${THRESHOLD}%"
            exit 1
          fi
      - name: Per-package coverage floor (candidate 4)
        run: |
          # 单包最低线：有测试的包低于 40% 即红（QA 第 10 轮落账候选 4）。
          # 无测试文件的包（如 internal/models）不出现在 coverage.out，天然豁免。
          python3 - <<'EOF'
          import collections, sys
          tot = collections.defaultdict(int)
          cov = collections.defaultdict(int)
          for line in open('coverage.out'):
              line = line.strip()
              if not line or line.startswith('mode:'):
                  continue
              pos, num, cnt = line.rsplit(' ', 2)
              pkg = pos.rsplit('/', 1)[0] if '/' in pos else pos
              tot[pkg] += int(num)
              if int(cnt) > 0:
                  cov[pkg] += int(num)
          floor = 40.0
          bad = []
          for pkg in sorted(tot):
              pct = 100 * cov[pkg] / tot[pkg]
              print(f"{pkg}: {pct:.1f}%")
              if pct < floor:
                  bad.append(pkg)
          if bad:
              print(f"per-package floor {floor}% violated: {bad}")
              sys.exit(1)
          print(f"per-package floor {floor}%: OK ({len(tot)} packages)")
          EOF
